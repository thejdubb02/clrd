name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push cancels the older run on the same branch or pull request. On
# main each commit is its own group, so no run there is ever cancelled: a
# rerun of an older commit cannot cancel the newest (#379, #402).
# Publishing lives in fdroid.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    # Tests, CI and refactors no user would notice carry the no-changelog label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/changelog-check.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
