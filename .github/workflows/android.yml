name: android

on:
  push:
    branches: [main]
    paths: ['android/**', 'assets/sounds/**', '.github/workflows/android.yml', '.github/size-*']
  pull_request:
    paths: ['android/**', 'assets/sounds/**', '.github/workflows/android.yml', '.github/size-*']
  workflow_dispatch:

# A new push cancels the older run on the same branch or pull request, so
# main runs only its newest commit (#379). Publishing lives in fdroid.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, cezar1]
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_HOME: /opt/android-sdk
      # Gradle 8 cannot run on the newer JDK that is now the runner default; the app builds with 17.
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleRelease
      - name: size budget
        run: ../.github/size-check.sh apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
