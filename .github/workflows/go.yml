name: go

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - "assets/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/go.yml"
      - ".github/size-*"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - "assets/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/go.yml"
      - ".github/size-*"

# A new push cancels the older run on the same branch or pull request. On
# main each commit is its own group, so no run there is ever cancelled: a
# rerun of an older commit cannot cancel the newest (#379, #402).
# Publishing lives in fdroid.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, cezar1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l server web)" || { gofmt -l server web; exit 1; }
      - run: go vet ./...
      - name: ntfy client for the import test
        # Pinned to the version the fixtures were made with (server/testdata/ntfy).
        run: |
          v=2.38.1
          d="$RUNNER_TEMP/ntfy"
          mkdir -p "$d"
          curl -fsSL -o "$d/ntfy.tar.gz" "https://github.com/binwiederhier/ntfy/releases/download/v$v/ntfy_${v}_linux_amd64.tar.gz"
          echo "9727d45e5da86c3f338f0f329044485bddde76f3fbbbc3f9e695c14776f09c32  $d/ntfy.tar.gz" | sha256sum -c -
          tar -xzf "$d/ntfy.tar.gz" -C "$d"
          echo "NTFY_BIN=$d/ntfy_${v}_linux_amd64/ntfy" >> "$GITHUB_ENV"
      - name: test
        # -race needs a C compiler; run without it if the runner has none.
        run: go test $(command -v gcc >/dev/null && echo -race) -count=1 ./...
      - name: static build and size budget
        # Same flags as the Dockerfile, so this is the size people download.
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/thejdubb02/clrd.Commit=$GITHUB_SHA -X github.com/thejdubb02/clrd.Built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "$RUNNER_TEMP/clrd" ./server/cmd/clrd
          .github/size-check.sh server "$RUNNER_TEMP/clrd"
