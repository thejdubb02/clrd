# Example: docker compose up -d, then read the setup link from
# docker compose logs clrd. Put a TLS proxy in front for phones.
services:
  clrd:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CLRD_BASE_URL: https://clrd.example.com
      # CLRD_RETENTION: 720h
    volumes:
      - clrd-data:/data

volumes:
  clrd-data:
