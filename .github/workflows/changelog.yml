name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    # Tests, CI and refactors no user would notice carry the no-changelog label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: [self-hosted, cezar1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/changelog-check.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
