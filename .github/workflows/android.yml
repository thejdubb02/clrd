name: android

on:
  push:
    branches: [main]
    paths: ['android/**', 'assets/sounds/**', '.github/workflows/android.yml', '.github/size-*']
  pull_request:
    paths: ['android/**', 'assets/sounds/**', '.github/workflows/android.yml', '.github/size-*']
  workflow_dispatch:

# A new push cancels the older run on the same branch or pull request. On
# main each commit is its own group, so no run there is ever cancelled: a
# rerun of an older commit cannot cancel the newest (#379, #402).
# Publishing lives in fdroid.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # Gradle 8 cannot run on the newer JDK that is the runner default; the app builds with 17.
      # The runner image ships the Android SDK and sets ANDROID_HOME itself.
      - run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon assembleDebug verifyRoborazziDebug lintDebug assembleRelease
      - name: size budget
        run: ../.github/size-check.sh apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
