[package]
name = "clrd-core"
description = "clrd desktop core: sync client, with no window or GUI code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Every crate here is in the binary, so each one says why it is not std (#298).
[dependencies]
# JSON on the wire and in the state file. std has no JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebSocket client, blocking, no async runtime. TLS comes from the OS
# (OpenSSL on Linux, SChannel on Windows), so no TLS stack is compiled in.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
# Blocking HTTP client for the few REST calls, on the same OS TLS.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
# Already in the tree (tungstenite logs through it); named here only to
# compile trace logging out of the whole app. tungstenite traces the raw
# handshake, Authorization header included, so with trace on the token could
# reach a log file.
log = { version = "0.4", features = ["max_level_debug"] }