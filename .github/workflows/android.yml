name: android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, cezar1]
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_HOME: /opt/android-sdk
      # Gradle 8 cannot run on the newer JDK that is now the runner default; the app builds with 17.
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
