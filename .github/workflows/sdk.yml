name: sdk

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"

# The runner cannot install packages, so each SDK runs in its own image.
# The checkout is mounted read-only, so nothing root-owned is left behind.
# cezar1 is shared, so each container gets at most 3 CPUs.
# A new push cancels the older run on the same branch or pull request. On
# main each commit is its own group, so no run there is ever cancelled: a
# rerun of an older commit cannot cancel the newest (#379, #402).
# Publishing lives in fdroid.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, cezar1]
    steps:
      - uses: actions/checkout@v4
      - name: go
        run: |
          docker run --rm --cpus 3 -v "$PWD/sdk/go:/s:ro" -w /s -e GOTOOLCHAIN=local -e GOFLAGS=-buildvcs=false \
            golang:1.23 sh -c 'go vet ./... && go test -p 2 -race -count=1 ./...'
      - name: js
        if: ${{ !cancelled() }} # one SDK failing still runs the rest
        run: docker run --rm --cpus 3 -v "$PWD/sdk/js:/s:ro" -w /s node:22-slim node --test test.js
      - name: python
        if: ${{ !cancelled() }} # one SDK failing still runs the rest
        run: |
          docker run --rm --cpus 3 -v "$PWD/sdk/python:/s:ro" -w /s -e PYTHONDONTWRITEBYTECODE=1 \
            python:3.12-slim python -m unittest -v test_clrd.py
      - name: action
        if: ${{ !cancelled() }} # one SDK failing still runs the rest
        run: |
          docker run --rm --cpus 3 -v "$PWD/sdk/action:/s:ro" -w /s -e PYTHONDONTWRITEBYTECODE=1 python:3.12-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends curl jq >/dev/null && python test_action.py -v'
