name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push to a pull request cancels its older run. Pushes to main each
# get their own group (by commit), so main always gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changelog:
    # Tests, CI and refactors no user would notice carry the no-changelog label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: [self-hosted, cezar1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/changelog-check.sh "origin/$BASE"
        env:
          BASE: ${{ github.base_ref }}
