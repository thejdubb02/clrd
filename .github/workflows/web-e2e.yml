name: web-e2e

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - "assets/**"
      - "*.go"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "docs/**"
      - "assets/**"
      - "*.go"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-e2e.yml"

# A new push cancels the older run on the same branch or pull request. On
# main each commit is its own group, so no run there is ever cancelled: a
# rerun of an older commit cannot cancel the newest (#379, #402).
# Publishing lives in fdroid.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: app.css matches its source
        run: web/ui/check.sh
      - name: upload app.css builds that differed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-css
          path: ${{ runner.temp }}/app-css
          if-no-files-found: ignore
      - name: build
        # The packed build, as it ships (#690).
        run: go run ./server/cmd/pack && CGO_ENABLED=0 go build -tags packed -o "$RUNNER_TEMP/clrd" ./server/cmd/clrd
      - name: inbox and screenshots in Chromium, side by side
        # The two suites start their own servers on free ports, so they run at
        # once (#922): the inbox suite spends over a minute waiting on server
        # timers, and the screenshot suite fills that time. Its log prints after.
        # The screenshot container keeps its own network, so the two servers
        # can never pick the same port.
        run: |
          img=mcr.microsoft.com/playwright:v1.48.0-jammy
          docker pull -q "$img"
          mkdir -p "$RUNNER_TEMP/shots"
          docker run --rm --init \
            -v "$PWD/web/e2e:/pw/e2e:ro" -v "$RUNNER_TEMP/clrd:/usr/local/bin/clrd:ro" -v "$RUNNER_TEMP/shots:/shots" \
            -e OUT=/shots -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$img" \
            sh -c 'cd /pw && npm i --silent --no-audit --no-fund playwright@1.48.0 @axe-core/playwright@4.10.1 && node e2e/screens.mjs; rc=$?; chown -R "$HOST_UID:$HOST_GID" /shots; exit $rc' \
            > "$RUNNER_TEMP/screens.log" 2>&1 &
          screens=$!
          rc=0
          docker run --rm --network host --init \
            -v "$PWD/web/e2e:/pw/e2e:ro" -v "$RUNNER_TEMP/clrd:/usr/local/bin/clrd:ro" \
            "$img" \
            sh -c 'cd /pw && npm i --silent --no-audit --no-fund playwright@1.48.0 && node e2e/inbox.mjs' || rc=$?
          wait "$screens" || rc=$((rc ? rc : $?))
          echo "::group::screenshots, axe and console errors"; cat "$RUNNER_TEMP/screens.log"; echo "::endgroup::"
          exit "$rc"
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
