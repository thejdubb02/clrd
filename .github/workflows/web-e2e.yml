name: web-e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-e2e.yml"

jobs:
  browser:
    runs-on: [self-hosted, cezar1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/clrd" ./server/cmd/clrd
      - name: inbox in Chromium
        run: |
          docker run --rm --network host --init \
            -v "$PWD/web/e2e:/pw/e2e:ro" -v "$RUNNER_TEMP/clrd:/usr/local/bin/clrd:ro" \
            mcr.microsoft.com/playwright:v1.48.0-jammy \
            sh -c 'cd /pw && npm i --silent --no-audit --no-fund playwright@1.48.0 && node e2e/inbox.mjs'
